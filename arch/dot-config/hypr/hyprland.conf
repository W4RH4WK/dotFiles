bind = SUPER SHIFT, S, exec, myshell screenshot_edit

bind = SUPER, Grave, exec, myshell menu
bind = SUPER CONTROL, A, exec, myshell audio
bind = SUPER CONTROL, B, exec, myshell bluetooth
bind = SUPER CONTROL, C, exec, myshell cal
bind = SUPER CONTROL, M, exec, myshell media
bind = SUPER CONTROL, N, exec, myshell network
bind = SUPER CONTROL, T, exec, myshell top

binde = , XF86AudioRaiseVolume, exec, myshell audio_up
binde = , XF86AudioLowerVolume, exec, myshell audio_down
