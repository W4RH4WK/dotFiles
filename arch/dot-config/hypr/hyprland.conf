bind = SUPER, Left, layoutmsg, orientationleft
bind = SUPER, Right, layoutmsg, orientationright

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, togglespecialworkspace, scratch

bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT, 0, movetoworkspacesilent, special:scratch

bind = SUPER, Tab, workspace, previous_per_monitor

bind = SUPER, E, exec, myshell files
bind = SUPER SHIFT, E, exec, gio open ~/Downloads
bind = SUPER, C, exec, myshell calc
bind = SUPER, Backslash, exec, myshell find
bind = SUPER SHIFT, Backslash, exec, myshell find /

bind = SUPER, Y, exec, myshell notify_menu
bind = SUPER, U, exec, myshell notify_dismiss
bind = SUPER SHIFT, U, exec, myshell notify_restore

bind = SUPER, Period, exec, myshell emoji

bind = , Print, exec, myshell screenshot
