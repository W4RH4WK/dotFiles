general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
	color = rgb(25, 20, 20)
}

input-field {
    monitor =
    size = 25%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgb(82aaff)
    check_color = rgb(ffcb6b)
    fail_color = rgb(ff5370)

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 5

    font_family = Roboto
    placeholder_text = Password
    fail_text = Roboto

    dots_spacing = 0.2

    position = 0, -33%
    halign = center
    valign = top
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = Roboto

    position = -100, -100
    halign = right
    valign = top
}
